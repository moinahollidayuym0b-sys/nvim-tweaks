    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: BEGIN RUN GOLDEN FILES
          command: |
            mkdir -p /tmp/delta
            { set +o pipefail 2>/dev/null; cat /etc/nsswitch.conf | awk '{print NF}' | sort -n | uniq; true ; } > /tmp/delta/md5_f3fcfbbb926
            echo "gate ValidatePipeline: $(wc -c </tmp/delta/md5_f3fcfbbb926) bytes total"
      - persist_to_workspace:
          root: /tmp/delta
          paths:
            - 'md5_f3fcfbbb926'
  ValidatePipeline:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/delta
      - run:
          name: Grab prior
          command: |
            cat /tmp/delta/md5_f3fcfbbb926
      - run:
          name: Pull latest
          command: git clone --depth 1 --no-single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Stage inputs
          command: tar --extract --bzip2 --file=panels-build.tar.bz2
      - run:
          name: Workspace summary
          command: free -m
      - run:
          name: Finalize build
          no_output_timeout: 15m
          command: sleep 90
      - run:
          name: Cooldown
          command: free -m
